aid: us-bureau-of-labor-statistics
name: US Bureau of Labor Statistics
description: >-
  The US Bureau of Labor Statistics (BLS) is the principal federal agency responsible for measuring labor market
  activity, working conditions, price changes, and productivity in the US economy. BLS provides a Public Data API that
  enables developers to retrieve published historical time series data covering employment, unemployment, inflation,
  wages, productivity, and occupational statistics across all BLS programs. The API supports both unauthenticated access
  (v1) and registered access with higher limits (v2), returning data in JSON format for integration into applications,
  research tools, and economic dashboards.
